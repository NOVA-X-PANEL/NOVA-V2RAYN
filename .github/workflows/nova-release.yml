name: NOVA-V2RAYN Windows Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v7.25.5-nova)'
        required: false
        default: 'v7.25.5'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            rid: win-x64
            target_bin: 64
          - arch: arm64
            rid: win-arm64
            target_bin: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build NOVA-V2RAYN (${{ matrix.rid }})
        shell: bash
        working-directory: ./v2rayN
        run: |
          dotnet publish ./v2rayN/v2rayN.csproj -c Release -r ${{ matrix.rid }} -p:SelfContained=true -p:EnableWindowsTargeting=true -o ../dist/NOVA-V2RAYN-${{ matrix.arch }}
          dotnet publish ./AmazTool/AmazTool.csproj -c Release -r ${{ matrix.rid }} -p:SelfContained=true -p:PublishTrimmed=true -p:EnableWindowsTargeting=true -o ../dist/NOVA-V2RAYN-${{ matrix.arch }}

      - name: Download & Merge Core Binaries
        shell: bash
        run: |
          mkdir -p temp_core
          curl -sSL "https://github.com/2dust/v2rayN-core-bin/raw/refs/heads/master/v2rayN-windows-${{ matrix.target_bin }}.zip" -o temp_core/cores.zip
          7z x temp_core/cores.zip -o./dist/NOVA-V2RAYN-${{ matrix.arch }} -y || true

      - name: Package Release Zip
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == refs/heads/* ]] || [[ -z "$TAG" ]]; then
            TAG="${{ inputs.release_tag || 'v7.25.5' }}"
          fi
          cd dist
          7z a -tzip "../NOVA-V2RAYN-windows-${{ matrix.arch }}.zip" "./NOVA-V2RAYN-${{ matrix.arch }}/*" -mx9

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-V2RAYN-windows-${{ matrix.arch }}
          path: NOVA-V2RAYN-windows-${{ matrix.arch }}.zip

  publish-release:
    name: Publish GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v7.25.5' }}
          name: NOVA-V2RAYN ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v7.25.5' }}
          body: |
            ## ⚡️ NOVA-V2RAYN Windows Release

            کلاینت اختصاصی ویندوز با هویت بصری **NOVA Cyberpunk Dark OLED**.

            ### تغییرات این نسخه:
            - 🌌 تم اختصاصی دارک سایبرپانک و نئون اولد (`#0B0E14` و `#00F0FF`)
            - ⚡️ سیستم رنگ‌بندی جدید و مدرن پینگ سرورها (سبز زمردی، فیروزه‌ای، کهربایی، قرمز)
            - 🛡 پشتیبانی کامل از Xray-core و sing-box با تنظیمات تونل، ECH و Clean IP
            - 🚀 بدون تبلیغات و با اتصال مستقیم به کانال به‌روزرسانی NOVA

            ---
            ### فایل‌های اجرایی:
            - `NOVA-V2RAYN-windows-x64.zip` (مناسب تمام سیستم‌های ویندوز ۶۴ بیتی معمولی)
            - `NOVA-V2RAYN-windows-arm64.zip` (مناسب سیستم‌های مبتنی بر پردازنده ARM)
          files: release_assets/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
